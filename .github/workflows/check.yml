name: check
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Permit the pinned CLI sandbox on this disposable Ubuntu runner
        run: node scripts/codex-ci-profile.js install
      - run: npm test
      - name: Remove the CI-only AppArmor profile
        if: always()
        run: node scripts/codex-ci-profile.js remove
